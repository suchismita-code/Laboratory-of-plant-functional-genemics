<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04261e"/>
      <stop offset="100%" stop-color="#004d3d"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A885"/>
      <stop offset="50%" stop-color="#0FB9B1"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
  </defs>

  <!-- Dark Emerald container background -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>

    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Neural Network / Data Nodes & Connections -->
  <g stroke="url(#lineGrad)" stroke-width="2" stroke-opacity="0.7">
    <line x1="150" y1="180" x2="320" y2="120"/>
    <line x1="150" y1="180" x2="300" y2="260"/>
    <line x1="150" y1="180" x2="280" y2="420"/>
    <line x1="320" y1="120" x2="500" y2="180"/>
    <line x1="300" y1="260" x2="500" y2="180"/>
    <line x1="300" y1="260" x2="520" y2="340"/>
    <line x1="280" y1="420" x2="520" y2="340"/>
    <line x1="500" y1="180" x2="680" y2="250"/>
    <line x1="520" y1="340" x2="680" y2="250"/>
  </g>

  <!-- Glowing Graph Signal Wave -->
  <path d="M 100 480 Q 250 220 400 380 T 700 200" fill="none" stroke="#FFC857" stroke-width="4" filter="drop-shadow(0 0 8px #FFC857)"/>

  <!-- Data Nodes -->
  <circle cx="150" cy="180" r="10" fill="#00A885"/>
  <circle cx="320" cy="120" r="8" fill="#0FB9B1"/>
  <circle cx="300" cy="260" r="12" fill="#FFC857"/>
  <circle cx="280" cy="420" r="9" fill="#00A885"/>
  <circle cx="500" cy="180" r="14" fill="#0FB9B1"/>
  <circle cx="520" cy="340" r="10" fill="#FFC857"/>
  <circle cx="680" cy="250" r="16" fill="#00A885"/>

  <!-- Academic / Research Badges -->
  <rect x="230" y="470" width="340" height="70" rx="16" fill="#04261e" fill-opacity="0.9" stroke="#00A885" stroke-width="2"/>
  <text x="400" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Academic &amp; Applied Research Lab</text>
  <text x="400" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#FFC857" text-anchor="middle">Greater Noida, Uttar Pradesh, India</text>
</svg>
